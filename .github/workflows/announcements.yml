name: Announcements

on:
  schedule:
    - cron: "0 8-20 * * 1-5"
      timezone: Europe/Athens
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcements
  cancel-in-progress: false

jobs:
  announcements:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r app/requirements.txt
      - name: Check announcements
        id: check
        run: python app/announcements-bot.py
        env:
          ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.ANNOUNCEMENTS_WEBHOOK_URL }}
          ERRORS_WEBHOOK_URL: ${{ secrets.ERRORS_WEBHOOK_URL }}
          RSS_URL: ${{ secrets.RSS_URL }}
          LAST_ANNOUNCEMENT_ID_DIR: state
      - name: Save announcement checkpoint
        if: always() && steps.check.outcome != 'skipped'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_announcement_id.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update announcement checkpoint"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          
